# Dev loop:   docker compose up -d vllm qdrant   (run the API natively with uvicorn)
# Full stack: docker compose --profile app up -d

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  vllm:
    image: vllm/vllm-openai:${VLLM_TAG:-v0.32.0}
    <<: *gpu
    command: >
      ${LLM_HF_MODEL:-Qwen/Qwen2.5-Coder-7B-Instruct-AWQ}
      --served-model-name ${REPOBOT_LLM_MODEL:-qwen2.5-coder-7b}
      --gpu-memory-utilization ${VLLM_GPU_UTIL:-0.80}
      --max-model-len ${VLLM_MAX_LEN:-16384}
      ${VLLM_EXTRA_ARGS:-}
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
    ports:
      - "8000:8000"
    volumes:
      - hf-cache:/root/.cache/huggingface
    ipc: host
    restart: unless-stopped
    # The engine can die (e.g. "CUDA error: unknown error" after a WSL2 driver hiccup) while the
    # HTTP server keeps running; /health fails then, so `docker compose ps` shows "unhealthy".
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15m

  qdrant:
    image: qdrant/qdrant:${QDRANT_TAG:-latest}
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    <<: *gpu
    env_file: .env
    environment:
      - REPOBOT_LLM_BASE_URL=http://vllm:8000/v1
      - REPOBOT_QDRANT_URL=http://qdrant:6333
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - hf-cache:/root/.cache/huggingface
    depends_on:
      vllm:
        condition: service_healthy  # model loaded and engine alive, not just container started
      qdrant:
        condition: service_started

volumes:
  hf-cache:
  qdrant-data:
