<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Repo Onboarding Bot</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" media="(prefers-color-scheme: light)">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <span class="brand">🧭 Repo Onboarding Bot</span>
    <select id="repo-select" aria-label="Indexed repository"></select>
    <form id="index-form" class="index-form">
      <input id="repo-url" type="url" placeholder="https://github.com/owner/repo" aria-label="GitHub URL to index" required>
      <button type="submit">Index</button>
    </form>
    <div id="index-status" class="index-status" hidden>
      <progress id="index-progress" max="1" value="0"></progress>
      <span id="index-stage"></span>
    </div>
    <button id="new-chat" class="ghost" type="button" title="Clear the conversation">New chat</button>
  </header>

  <main class="layout">
    <section class="chat" aria-label="Conversation">
      <div id="messages" class="messages">
        <div class="empty" id="empty">
          <h2>Ask anything about the codebase</h2>
          <p>Pick an indexed repo above, or paste a GitHub URL to index a new one.
             Citations like <code>src/app.py:10-42</code> in answers open the code on the right.</p>
        </div>
      </div>
      <form id="ask-form" class="composer">
        <textarea id="question" rows="1" placeholder="e.g. What's the second class in model.py?" aria-label="Question"></textarea>
        <button id="send" type="submit">Send</button>
      </form>
    </section>

    <aside id="viewer" class="viewer" hidden aria-label="Source viewer">
      <div class="viewer-head">
        <div class="viewer-title">
          <span id="viewer-path" class="viewer-path"></span>
          <span id="viewer-range" class="viewer-range"></span>
        </div>
        <a id="viewer-github" target="_blank" rel="noopener">GitHub ↗</a>
        <button id="viewer-close" class="ghost" type="button" aria-label="Close source viewer">✕</button>
      </div>
      <div id="viewer-body" class="viewer-body"></div>
    </aside>
  </main>
</body>
</html>
