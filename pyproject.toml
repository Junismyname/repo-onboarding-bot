[project]
name = "repobot"
version = "0.1.0"
description = "Chat with any GitHub repository: self-hosted RAG over code with vLLM + Qdrant."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "openai>=1.40",                  # client for vLLM / Ollama (OpenAI-compatible APIs)
    "qdrant-client[fastembed]>=1.12", # vector DB client + BM25 sparse embeddings
    "sentence-transformers>=6.0",    # dense embedder + cross-encoder re-ranker
    "transformers>=4.48",            # ModernBERT embedder; Qwen tokenizer for prompt budgeting
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "httpx>=0.27",
]

[project.optional-dependencies]
bench = ["locust>=2.31"]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repobot"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
